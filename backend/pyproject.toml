[project]
name = "semantic-drive-backend"
version = "0.1.0"
description = "Semantic Drive FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "rq>=2.0.0",
  "minio>=7.2.10",
  "qdrant-client>=1.12.0",
  "openai>=1.59.0",
  "cohere>=5.13.0",
  "tenacity>=9.0.0",
  "pillow>=11.0.0",
  "orjson>=3.10.12",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
